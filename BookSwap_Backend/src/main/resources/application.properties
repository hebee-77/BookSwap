# Application configuration
spring.application.name=BookSwap

# Server configuration
server.port=8080

# Database connection configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookswap}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:7743}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.secret=${JWT_SECRET:bookswap_super_secret_jwt_key_that_is_at_least_32_bytes_long_12345}
jwt.expiration=86400000


