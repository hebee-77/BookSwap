# Application configuration
spring.application.name=BookSwap

# Server configuration
server.port=8080

# Database connection configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookswap}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:7743}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.secret=${JWT_SECRET:bookswap_super_secret_jwt_key_that_is_at_least_32_bytes_long_12345}
jwt.expiration=86400000
# File upload configuration
app.file.upload-dir=${UPLOAD_DIR:uploads/books}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Return OTP Verification Configuration
bookswap.return.otp.expiration-minutes=30
bookswap.return.otp.max-attempts=5
bookswap.return.otp.cooldown-seconds=30

